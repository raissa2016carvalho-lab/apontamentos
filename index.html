<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel de Pedidos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#1a1d23;--surface:#22262e;--surface2:#2a2f39;--border:#333844;
      --text:#e8edf5;--muted:#8892a4;
      --red:#e85454;--red-bg:#2d1a1a;--red-border:#5c2626;
      --yellow:#f0b429;--yellow-bg:#2d2510;--yellow-border:#5c4510;
      --blue:#3b82f6;--blue-bg:#1a2440;--blue-border:#2a3d6b;--green:#22c55e;
    }
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
    .header-left{display:flex;align-items:center;gap:12px;}
    .logo-mark{width:34px;height:34px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;}
    .logo-text{font-size:16px;font-weight:700;color:var(--text);}
    .logo-sub{font-size:11px;color:var(--muted);margin-top:1px;}
    #clock{font-size:20px;font-weight:700;color:var(--text);letter-spacing:1px;font-variant-numeric:tabular-nums;}
    #last-sync{font-size:11px;color:var(--muted);}
    #prox-sync{font-size:10px;color:var(--muted);margin-top:2px;}
    .status-conexao{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
    .status-online{background:rgba(34,197,94,0.12);color:var(--green);border:1px solid rgba(34,197,94,0.25);}
    .status-offline{background:rgba(232,84,84,0.12);color:var(--red);border:1px solid rgba(232,84,84,0.25);animation:pulse-red 1s infinite;}
    .status-reconectando{background:rgba(240,180,41,0.12);color:var(--yellow);border:1px solid rgba(240,180,41,0.25);animation:pulse-red 1s infinite;}
    @keyframes pulse-red{0%,100%{opacity:1}50%{opacity:0.5}}
    .filtro-bar{display:flex;align-items:center;gap:8px;padding:7px 24px;background:var(--surface2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
    .filtro-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;white-space:nowrap;}
    .filtro-select{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:5px 10px;outline:none;cursor:pointer;}
    .filtro-select:focus{border-color:var(--blue);}
    .filial-wrap{position:relative;}
    .filial-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:5px 10px;outline:none;min-width:140px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;height:31px;}
    .filial-btn:hover{border-color:var(--blue);}
    .filial-btn svg{flex-shrink:0;opacity:0.5;}
    .filial-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,0.4);max-height:220px;overflow-y:auto;}
    .filial-dropdown.open{display:block;}
    .filial-option{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;}
    .filial-option:hover{background:var(--surface2);}
    .filial-option input[type=checkbox]{accent-color:var(--blue);width:14px;height:14px;cursor:pointer;}
    .filial-tag{display:inline-flex;align-items:center;gap:4px;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border);border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600;}
    .btn-refresh{padding:5px 14px;background:var(--blue);border:none;border-radius:8px;color:#fff;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:opacity 0.2s;white-space:nowrap;}
    .btn-refresh:hover{opacity:0.85;}
    .toggle-servicos{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;padding:4px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);}
    .toggle-servicos input{accent-color:var(--blue);cursor:pointer;}
    .colunas{display:grid;grid-template-columns:1fr 1fr 1fr;flex:1;overflow:hidden;min-height:0;}
    .coluna{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
    .coluna:last-child{border-right:none;}
    .coluna-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
    .col-atrasados .coluna-header{background:var(--red-bg);border-bottom-color:var(--red-border);}
    .col-hoje .coluna-header{background:var(--yellow-bg);border-bottom-color:var(--yellow-border);}
    .col-semana .coluna-header{background:var(--blue-bg);border-bottom-color:var(--blue-border);}
    .coluna-titulo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;}
    .col-atrasados .coluna-titulo{color:var(--red);}
    .col-hoje .coluna-titulo{color:var(--yellow);}
    .col-semana .coluna-titulo{color:var(--blue);}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .col-atrasados .dot{background:var(--red);animation:blink-dot 1.2s infinite;}
    .col-hoje .dot{background:var(--yellow);}
    .col-semana .dot{background:var(--blue);}
    @keyframes blink-dot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(232,84,84,0.4)}50%{opacity:0.4;box-shadow:0 0 0 4px rgba(232,84,84,0)}}
    .coluna-badge{font-size:20px;font-weight:800;padding:2px 14px;border-radius:20px;}
    .col-atrasados .coluna-badge{background:var(--red-border);color:var(--red);}
    .col-hoje .coluna-badge{background:var(--yellow-border);color:var(--yellow);}
    .col-semana .coluna-badge{background:var(--blue-border);color:var(--blue);}
    .sort-btns{display:flex;gap:4px;margin-left:8px;}
    .sort-btn{padding:2px 8px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
    .sort-btn:hover{border-color:var(--blue);color:var(--blue);}
    .sort-btn.active{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue);}
    .coluna-body{overflow-y:auto;flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;}
    .coluna-body::-webkit-scrollbar{width:4px;}
    .coluna-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
    .empty{padding:24px 12px;text-align:center;font-size:12px;color:var(--muted);}
    .card{background:var(--surface);border-radius:6px;padding:10px 12px 10px 16px;position:relative;overflow:hidden;flex-shrink:0;}
    .card-line{position:absolute;left:0;top:0;bottom:0;width:4px;}
    .card-red{border:1px solid rgba(232,84,84,0.4);animation:glow-red 1.5s infinite;}
    .card-red .card-line{background:var(--red);box-shadow:0 0 6px var(--red);}
    .card-yellow{border:1px solid rgba(240,180,41,0.3);}
    .card-yellow .card-line{background:var(--yellow);}
    .card-blue{border:1px solid rgba(59,130,246,0.2);}
    .card-blue .card-line{background:var(--blue);}
    @keyframes glow-red{0%,100%{box-shadow:0 0 6px rgba(232,84,84,0.3)}50%{box-shadow:0 0 16px rgba(232,84,84,0.7),inset 0 0 10px rgba(232,84,84,0.05)}}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
    .card-num{font-size:11px;font-weight:600;color:var(--muted);}
    .card-date{font-size:11px;font-weight:600;}
    .card-red .card-date{color:var(--red);}
    .card-yellow .card-date{color:var(--yellow);}
    .card-blue .card-date{color:var(--blue);}
    .card-desc{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.3;}
    .card-obs{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:4px;}
    .card-status{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.05em;}
    .s-aprovado{background:rgba(59,130,246,0.12);color:var(--blue);border:1px solid rgba(59,130,246,0.25);}
    .s-pendente{background:rgba(240,180,41,0.12);color:var(--yellow);border:1px solid rgba(240,180,41,0.25);}
    .s-alerta{background:rgba(232,84,84,0.12);color:var(--red);border:1px solid rgba(232,84,84,0.25);}
    .card-footer{display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:5px;margin-top:3px;}
    .card-meta{font-size:10px;color:var(--muted);font-weight:500;}
    .card-meta span{color:var(--text);}
    .card:hover{cursor:pointer;filter:brightness(1.08);}
    .badge-alterada{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;background:rgba(168,85,247,0.15);color:#a855f7;border:1px solid rgba(168,85,247,0.35);margin-left:6px;}
    .col-pills{display:flex;flex-direction:column;gap:3px;align-items:flex-end;}
    .col-pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,0.07);color:var(--muted);letter-spacing:0.04em;white-space:nowrap;}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;min-width:340px;box-shadow:0 24px 60px rgba(0,0,0,0.5);}
    .modal-title{font-size:15px;font-weight:700;margin-bottom:4px;}
    .modal-sub{font-size:12px;color:var(--muted);margin-bottom:20px;}
    .modal-label{font-size:11px;font-weight:600;color:var(--yellow);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;display:block;}
    .modal-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;outline:none;margin-bottom:16px;}
    .modal-input:focus{border-color:#a855f7;}
    .modal-btns{display:flex;gap:8px;justify-content:flex-end;}
    .modal-btn{padding:8px 20px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;}
    .modal-btn-cancel{background:var(--surface2);color:var(--muted);}
    .modal-btn-save{background:#a855f7;color:#fff;}
    .modal-btn-clear{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);}
    #loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
    .loading-text{font-size:13px;color:var(--muted);font-weight:500;}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* ── TELA DE LOGIN ── */
    #login-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:500;}
    .login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:340px;box-shadow:0 24px 60px rgba(0,0,0,0.5);text-align:center;}
    .login-logo{width:48px;height:48px;background:var(--blue);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin:0 auto 16px;}
    .login-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:4px;}
    .login-sub{font-size:12px;color:var(--muted);margin-bottom:24px;}
    .login-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;padding:12px 14px;outline:none;text-align:center;letter-spacing:2px;margin-bottom:12px;}
    .login-input:focus{border-color:var(--blue);}
    .login-btn{width:100%;padding:12px;background:var(--blue);border:none;border-radius:10px;color:#fff;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity 0.2s;}
    .login-btn:hover{opacity:0.88;}
    .login-erro{font-size:12px;color:var(--red);margin-top:12px;min-height:16px;}
    .btn-sair{background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:4px 10px;cursor:pointer;}
    .btn-sair:hover{border-color:var(--red);color:var(--red);}
  </style>
</head>

  <!-- MODAL NOVA DATA -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-title">📅 Nova Previsão de Entrega</div>
      <div class="modal-sub" id="modal-sub"></div>
      <label class="modal-label">Nova data de entrega</label>
      <input class="modal-input" type="date" id="modal-data"/>
      <div class="modal-btns">
        <button class="modal-btn modal-btn-clear" onclick="limparData()">Remover data</button>
        <button class="modal-btn modal-btn-cancel" onclick="fecharModal()">Cancelar</button>
        <button class="modal-btn modal-btn-save" onclick="salvarData()">Salvar</button>
      </div>
    </div>

  <header>
    <div class="header-left">
      <div class="logo-mark">P</div>
      <div>

    const app = initializeApp({

    let raw = [], datasAlteradas = {};
    const sortState = { atrasados:'data-asc', hoje:'data-asc', semana:'data-asc' };

    let jaCarregouUmaVez = false;  // true depois do primeiro carregamento bem-sucedido

    // ── LOGIN SIMPLES (anti-acesso casual) ───────────────────────────
    // ATENÇÃO: esta senha fica no código e é visível pra quem abrir o
    // código-fonte da página. Serve só pra impedir acesso externo casual,
    // NÃO é segurança de verdade. A sessão fica salva neste navegador e
    // expira em 30 dias; um navegador novo sempre pede a senha.
    const SENHA="2026qeb";
    const SESSAO_DIAS=30;
    const SESSAO_KEY="painel_login_ts";

    function sessaoValida(){
      try{
        const ts=Number(localStorage.getItem(SESSAO_KEY)||0);
        if(!ts) return false;
        const dias=(Date.now()-ts)/(1000*60*60*24);
        return dias < SESSAO_DIAS;
      }catch(e){ return false; }
    }
    function gravarSessao(){
      try{ localStorage.setItem(SESSAO_KEY,String(Date.now())); }catch(e){}
    }
    function sair(){
      try{ localStorage.removeItem(SESSAO_KEY); }catch(e){}
      location.reload();
    }
    window.sair=sair;

    function tentarLogin(){
      const inp=document.getElementById("login-senha");
      const err=document.getElementById("login-erro");
      if(inp.value===SENHA){
        gravarSessao();
        document.getElementById("login-overlay").style.display="none";
        iniciarApp();
      }else{
        err.textContent="Senha incorreta.";
        inp.value="";
        inp.focus();
      }
    }

    // Liga os eventos do login assim que a página monta
    document.getElementById("btn-sair").addEventListener("click",sair);
    document.getElementById("login-btn").addEventListener("click",tentarLogin);
    document.getElementById("login-senha").addEventListener("keydown",e=>{ if(e.key==="Enter") tentarLogin(); });

    // Decide: já tem sessão válida? entra direto. Senão, mostra login.
    if(sessaoValida()){
      document.getElementById("login-overlay").style.display="none";
      // iniciarApp() é chamado no fim do script (depois das funções definidas)
    }else{
      document.getElementById("login-overlay").style.display="flex";
      document.getElementById("loading").style.display="none";
      setTimeout(()=>{ const s=document.getElementById("login-senha"); if(s) s.focus(); },100);
    }

    // ── MAPA DE GRUPOS ───────────────────────────────────────────────

      '2070': {nome:'SOBRESSALENTES', geral:'MANUTENÇÃO VEICULOS/EQUIPAMENTOS'},
      '2080': {nome:'PNEUS E CAMARAS', geral:'MANUTENÇÃO VEICULOS/EQUIPAMENTOS'},
      '2090': {nome:'MATERIAIS DE LIMPEZA E HIGIENE', geral:'HIGIENE E LIMPEZA'},

      '2092': {nome:'MAQUINAS E EQUIPAMENTOS PESADOS', geral:'MANUTENÇÃO VEICULOS/EQUIPAMENTOS'},

      '5008': {nome:'PVC CLIENTES', geral:'MATERIAL CLIENTE'},

    };

    function nomeGrupo(cod) {
      const g = GRUPOS[String(cod||"").trim()];
      return g ? g.geral : (cod||"-");
    }
    function isServico(cod) {
      return String(cod||"").trim().startsWith("3");
    }

    // ── PRÓXIMA ATUALIZAÇÃO ──────────────────────────────────────────
    setInterval(()=>{
      document.getElementById("clock").textContent=new Date().toLocaleTimeString("pt-BR");
      // Próxima atualização é diária: conta o tempo até a próxima meia-noite.
      {
        const agora=new Date();
        const meiaNoite=new Date(agora.getFullYear(),agora.getMonth(),agora.getDate()+1,0,0,5);
        const diff=Math.max(0,meiaNoite-agora);
        const h=Math.floor(diff/3600000);
        const m=Math.floor((diff%3600000)/60000);
        const s=Math.floor((diff%60000)/1000);
        document.getElementById("prox-sync").textContent=`Próxima atualização: ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }
    },1000);

    // ── RECONEXÃO ────────────────────────────────────────────────────
    function setStatus(estado){
      const el=document.getElementById("status-conexao");
      el.className="status-conexao";
      if(estado==='online'){el.classList.add("status-online");el.textContent="● Online";}
      else if(estado==='offline'){el.classList.add("status-offline");el.textContent="● Offline";}
      else if(estado==='congelado'){
        // Falhou uma atualização, mas há dados na tela. Não assusta: avisa que está vendo dados de antes.
        el.classList.add("status-reconectando");
        const hora=ultimoSyncOk?ultimoSyncOk.toLocaleTimeString("pt-BR").slice(0,5):"--:--";
        el.textContent=`● Dados de ${hora}`;
      }
      else{el.classList.add("status-reconectando");el.textContent="● Reconectando...";}
    }
    window.addEventListener('online',()=>{setStatus('reconectando');setTimeout(carregarDados,2000);});
    window.addEventListener('offline',()=>{ setStatus(jaCarregouUmaVez?'congelado':'offline'); });

    // WakeLock
    let wakeLock=null;
    async function pedirWakeLock(){
      try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>setTimeout(pedirWakeLock,3000)); } }catch(e){}
    }
    pedirWakeLock();
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pedirWakeLock(); });

    // ── DROPDOWNS ────────────────────────────────────────────────────
    window.toggleGrupoDropdown=()=>{ document.getElementById("obs-dropdown").classList.remove("open"); document.getElementById("filial-dropdown").classList.remove("open"); document.getElementById("grupo-dropdown").classList.toggle("open"); }
    document.addEventListener("click",e=>{
      if(!e.target.closest("#filial-btn")&&!e.target.closest("#filial-dropdown")) document.getElementById("filial-dropdown").classList.remove("open");
      if(!e.target.closest("#obs-btn")&&!e.target.closest("#obs-dropdown")) document.getElementById("obs-dropdown").classList.remove("open");
      if(!e.target.closest("#grupo-btn")&&!e.target.closest("#grupo-dropdown")) document.getElementById("grupo-dropdown").classList.remove("open");
    });
    window.toggleFilialDropdown=()=>{ document.getElementById("obs-dropdown").classList.remove("open"); document.getElementById("grupo-dropdown").classList.remove("open"); document.getElementById("filial-dropdown").classList.toggle("open"); }
    window.toggleObsDropdown=()=>{ document.getElementById("filial-dropdown").classList.remove("open"); document.getElementById("grupo-dropdown").classList.remove("open"); document.getElementById("obs-dropdown").classList.toggle("open"); }
    function getFilialSelecionadas(){ return [...document.querySelectorAll(".filial-chk:checked")].map(c=>c.value); }
    function getGruposSelecionados(){ return [...document.querySelectorAll(".grupo-chk:checked")].map(c=>c.value); }
    function getObsSelecionadas(){ return [...document.querySelectorAll(".obs-chk:checked")].map(c=>c.value); }
    window.atualizarBtnGrupo = function(){
      const sel=getGruposSelecionados(),btn=document.getElementById("grupo-btn-text");
      btn.innerHTML=sel.length?`<span class="filial-tag">${sel.length} grupo${sel.length>1?'s':''}</span>`:"Todos os grupos";
    }
    function atualizarBtnFilial(){
      const sel=getFilialSelecionadas(),btn=document.getElementById("filial-btn-text");
      btn.innerHTML=sel.length?sel.map(f=>`<span class="filial-tag">Fil. ${f}</span>`).join(" "):"Todas as filiais";
    }
    window.atualizarBtnObs=function(){
      const sel=getObsSelecionadas(),btn=document.getElementById("obs-btn-text");
      btn.innerHTML=sel.length?`<span class="filial-tag">${sel.length} selecionada${sel.length>1?'s':''}</span>`:"Todas";
    }
    function renderGrupoList(lista){
      const div=document.getElementById("grupo-list");
      if(!lista.length){div.innerHTML='<div style="padding:8px 12px;font-size:12px;color:var(--muted)">Nenhum grupo</div>';return;}
      div.innerHTML=lista.map(g=>`<div class="filial-option"><input type="checkbox" class="grupo-chk" value="${g}" onchange="setTimeout(()=>{window.atualizarBtnGrupo();window.renderTudo();},0)"><label style="cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px;" title="${g} — ${nomeGrupo(g)}">${g} — ${nomeGrupo(g)}</label></div>`).join("");
    }
    window.filtrarGrupos=function(){
      const q=document.getElementById("grupo-search").value.toLowerCase();
      renderGrupoList((window._todosGrupos||[]).filter(g=>g.toLowerCase().includes(q)||nomeGrupo(g).toLowerCase().includes(q)));
    }
    let todasObs=[];
    function popularObs(){
      todasObs=[...new Set(raw.map(p=>(p.C7_OBS||"").trim()).filter(Boolean))].sort();
      renderObsList(todasObs);
    }
    function renderObsList(lista){
      const div=document.getElementById("obs-list");
      if(!lista.length){div.innerHTML='<div style="padding:8px 12px;font-size:12px;color:var(--muted)">Nenhuma observação</div>';return;}
      div.innerHTML=lista.map(o=>`<div class="filial-option"><input type="checkbox" class="obs-chk" value="${o.replace(/"/g,'&quot;')}" onchange="setTimeout(()=>{window.atualizarBtnObs();window.renderTudo();},0)"><label style="cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px;" title="${o}">${o}</label></div>`).join("");
    }
    window.filtrarObs=function(){
      const q=document.getElementById("obs-search").value.toLowerCase();
      renderObsList(todasObs.filter(o=>o.toLowerCase().includes(q)));
    }

    // ── UTILITÁRIOS ──────────────────────────────────────────────────
    function fmt(s){const str=String(s||"").replace(/\D/g,"");if(str.length!==8)return "-";return `${str.slice(6,8)}/${str.slice(4,6)}/${str.slice(0,4)}`;}
    function dtNum(s){return String(s||"").replace(/\D/g,"");}
    function getToday(){const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;}
    function getEndWeek(){const d=new Date();d.setDate(d.getDate()+7);return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;}
    function statusCls(s){
      const v=String(s||"").toLowerCase();
      if(v.includes("aprov")) return "s-aprovado";
      if(v.includes("elimin")||v.includes("cancel")) return "s-alerta";
      return "s-pendente";
    }
    window.setSort=function(col,modo,btn){
      sortState[col]=modo;
      btn.closest('.sort-btns').querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderTudo();
    }
    function ordenar(lista,modo){
      const l=[...lista];
      if(modo==='data-asc') return l.sort((a,b)=>dtNum(a["DT ENTREGA"]).localeCompare(dtNum(b["DT ENTREGA"])));
      if(modo==='data-desc') return l.sort((a,b)=>dtNum(b["DT ENTREGA"]).localeCompare(dtNum(a["DT ENTREGA"])));
      if(modo==='valor-desc') return l.sort((a,b)=>Number(b.C7_TOTAL||0)-Number(a.C7_TOTAL||0));
      if(modo==='valor-asc') return l.sort((a,b)=>Number(a.C7_TOTAL||0)-Number(b.C7_TOTAL||0));
      return l;
    }

    // ── MODAL DATA ───────────────────────────────────────────────────
    let modalPedNum=null;
    window.abrirModal=function(pedNum,pedFilial,dtAtual){
      modalPedNum=pedFilial.trim()+'_'+pedNum.trim();
      document.getElementById("modal-sub").textContent=`Pedido: ${pedNum} · Filial: ${pedFilial}`;
      const dtAlterada=datasAlteradas[modalPedNum];
      document.getElementById("modal-data").value=dtAlterada?`${dtAlterada.slice(0,4)}-${dtAlterada.slice(4,6)}-${dtAlterada.slice(6,8)}`:"";
      document.getElementById("modal-overlay").classList.add("open");
    }
    window.fecharModal=function(){ document.getElementById("modal-overlay").classList.remove("open"); modalPedNum=null; }
    window.salvarData=async function(){
      const val=document.getElementById("modal-data").value;
      if(!val){alert("Selecione uma data!");return;}
      const dtStr=val.replace(/-/g,"");
      const btn=document.querySelector(".modal-btn-save");
      btn.textContent="Salvando..."; btn.disabled=true;
      try{
        await setDoc(doc(db,"datas_alteradas",String(modalPedNum)),{pedido:String(modalPedNum),nova_data:dtStr,alterado_em:new Date().toISOString()});
        datasAlteradas[String(modalPedNum)]=dtStr;
        fecharModal(); window.renderTudo();
      }catch(e){alert("Erro ao salvar: "+e.message);}
      btn.textContent="Salvar"; btn.disabled=false;
    }
    window.limparData=async function(){
      if(!modalPedNum) return;
      try{ await deleteDoc(doc(db,"datas_alteradas",String(modalPedNum))); delete datasAlteradas[String(modalPedNum)]; fecharModal(); window.renderTudo(); }catch(e){alert("Erro: "+e.message);}
    }
    document.getElementById("modal-overlay").addEventListener("click",e=>{ if(e.target===document.getElementById("modal-overlay")) fecharModal(); });

    // ── TRAVA DE 1 ATUALIZAÇÃO POR DIA ───────────────────────────────
    // Para não consumir a cota do Firestore, o painel lê os dados no máximo
    // UMA vez por dia. A data da última carga E os próprios dados ficam
    // salvos no navegador (localStorage). Assim, recarregar a aba (F5) no
    // mesmo dia NÃO gera nova leitura: o painel carrega os pedidos do cache
    // local e só vai ao Firestore quando o dia virar.
    const CACHE_DIA="painel_cache_dia";
    const CACHE_DADOS="painel_cache_dados";
    const CACHE_DATAS="painel_cache_datas";
    function hojeStr(){
      const d=new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function jaAtualizouHoje(){
      try{ return localStorage.getItem(CACHE_DIA)===hojeStr(); }catch(e){ return false; }
    }
    function salvarCache(rawArr,datasObj){
      try{
        localStorage.setItem(CACHE_DIA,hojeStr());
        localStorage.setItem(CACHE_DADOS,JSON.stringify(rawArr));
        localStorage.setItem(CACHE_DATAS,JSON.stringify(datasObj));
        localStorage.setItem("painel_cache_hora",new Date().toISOString());
      }catch(e){ console.warn("Não consegui salvar cache local:",e); }
    }
    function lerCache(){
      try{
        const dados=JSON.parse(localStorage.getItem(CACHE_DADOS)||"null");
        const datas=JSON.parse(localStorage.getItem(CACHE_DATAS)||"null");
        const hora=localStorage.getItem("painel_cache_hora");
        if(Array.isArray(dados)&&dados.length) return {dados,datas:datas||{},hora};
      }catch(e){}
      return null;
    }

    // ── CARREGAR DADOS ───────────────────────────────────────────────
    // Estratégia "tela congelada": os dados novos são montados numa área
    // temporária e só substituem o que está na tela se a busca der certo E
    // trouxer pedidos. Se qualquer coisa falhar (conexão, código, Firestore
    // vazio por engano), NADA é apagado — as colunas continuam como estavam.
    async function carregarDados(){
      // TRAVA DIÁRIA: se já leu hoje, usa o cache local em vez de ir ao
      // Firestore. Funciona mesmo após F5, porque os dados ficam salvos.
      if(jaAtualizouHoje()){
        const cache=lerCache();
        if(cache){
          raw=cache.dados;
          datasAlteradas=cache.datas;
          montarFiltros();
          ultimoSyncOk=cache.hora?new Date(cache.hora):new Date();
          jaCarregouUmaVez=true;
          document.getElementById("last-sync").textContent="Atualizado: "+ultimoSyncOk.toLocaleString("pt-BR");
          // próxima atualização: amanhã de manhã (ver agendamento no fim)
          setStatus('online');
          popularObs();
          renderTudo();
          document.getElementById("loading").style.display="none";
          return; // <- não consome leitura do Firestore
        }
        // Se a flag de "hoje" existe mas o cache sumiu, deixa cair pra busca normal.
      }

      // Só mostra o spinner de tela cheia no primeiríssimo carregamento.
      if(!jaCarregouUmaVez) document.getElementById("loading").style.display="flex";

      let rawTmp, datasTmp;
      try{
        // 1) Buscar dados numa área temporária (ainda não mexe em nada da tela)
        const [snap,datasSnap]=await Promise.all([
          getDocs(collection(db,"pedidos_compra")),
          getDocs(collection(db,"datas_alteradas"))
        ]);

        datasTmp={};
        datasSnap.docs.forEach(d=>{ datasTmp[d.id]=d.data().nova_data; });

        const rawAll=snap.docs.map(d=>d.data());
        rawTmp=rawAll.filter(p=>{
          const em=dtNum(p.C7_EMISSAO);
          const st=String(p.STATUS_DESC||"").toLowerCase();
          return em>="20250601" && !st.includes("receb") && !st.includes("elimin") && !st.includes("rejeit");
        });

        // 2) VALIDAÇÃO: se a busca voltou sem nenhum pedido mas a tela JÁ tinha
        //    dados, isso é quase certamente um problema momentâneo (Firestore
        //    respondendo vazio, sync no meio do caminho, etc). Não zera a tela.
        if(rawTmp.length===0 && jaCarregouUmaVez && raw.length>0){
          throw new Error("Busca retornou 0 pedidos — mantendo dados anteriores na tela.");
        }

        window._rawAll=rawAll;
      }catch(e){
        // Falhou a atualização. Se já existe algo na tela, CONGELA (não apaga).
        console.error("Falha ao atualizar dados:", e);
        if(jaCarregouUmaVez){
          setStatus('congelado');   // amarelo: "Dados de HH:MM" — sem susto
        }else{
          setStatus('offline');     // só mostra Offline se nunca carregou nada
        }
        document.getElementById("loading").style.display="none";
        return; // sai sem tocar em raw, datasAlteradas, nem nas colunas
      }

      // 3) Deu certo: agora sim "commita" os dados novos e redesenha tudo.
      try{
        raw=rawTmp;
        datasAlteradas=datasTmp;

        montarFiltros();

        ultimoSyncOk=new Date();
        jaCarregouUmaVez=true;
        salvarCache(raw,datasAlteradas);   // guarda pro resto do dia (sobrevive a F5)
        document.getElementById("last-sync").textContent="Atualizado: "+ultimoSyncOk.toLocaleString("pt-BR");
        setStatus('online');
        popularObs();
        renderTudo();
      }catch(e){
        // Erro ao MONTAR a tela com dados que já vieram OK. Marca congelado e
        // não deixa a página meio-renderizada assustar ninguém.
        console.error("Falha ao renderizar dados (dados foram baixados OK):", e);
        if(jaCarregouUmaVez) setStatus('congelado'); else setStatus('offline');
      }finally{
        document.getElementById("loading").style.display="none";
      }
    }

    // Monta os dropdowns/selects de filtro a partir do array `raw` atual.
    // Usada tanto na carga do Firestore quanto ao restaurar do cache local.
    function montarFiltros(){
      // Popular grupos como checkboxes
      const gruposSet=[...new Set(raw.map(p=>p.C7_GRPPROD||"").filter(Boolean))].sort();
      const dd2=document.getElementById("grupo-dropdown");
      dd2.innerHTML=`<div style="padding:4px 6px 6px;"><input type="text" id="grupo-search" placeholder="🔍 Buscar grupo..." oninput="filtrarGrupos()" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:12px;padding:5px 10px;outline:none;"/></div><div id="grupo-list"></div>`;
      window._todosGrupos=gruposSet;
      renderGrupoList(gruposSet);

      // Popular filiais
      const filiais=[...new Set(raw.map(p=>p.C7_FILIAL||"").filter(Boolean))].sort();
      const dd=document.getElementById("filial-dropdown");
      dd.innerHTML=`<div class="filial-option"><input type="checkbox" id="chk-all" onchange="toggleAll(this)"> <label for="chk-all" style="cursor:pointer;font-weight:600;color:var(--text)">Todas</label></div>`;
      filiais.forEach(f=>{
        const div=document.createElement("div"); div.className="filial-option";
        div.innerHTML=`<input type="checkbox" class="filial-chk" value="${f}" onchange="renderTudo()"> <label style="cursor:pointer">Filial ${f}</label>`;
        dd.appendChild(div);
      });

      // Popular compradores
      const compradores=[...new Set(raw.map(p=>(p.C7_COMPRADOR||"").trim()).filter(Boolean))].sort();
      const selC=document.getElementById("f-comprador");
      selC.innerHTML='<option value="">Todos</option>';
      compradores.forEach(c=>{ const o=document.createElement("option"); o.value=c; o.textContent=c; selC.appendChild(o); });

      // Popular meses
      const mesesSet=new Set();
      raw.forEach(p=>{ const em=dtNum(p.C7_EMISSAO); if(em.length>=6) mesesSet.add(`${em.slice(4,6)}/${em.slice(0,4)}`); });
      const selM=document.getElementById("f-mes");
      selM.innerHTML='<option value="">Todos</option>';
      [...mesesSet].sort((a,b)=>{
        const [ma,ya]=a.split("/"); const [mb,yb]=b.split("/");
        return (yb+mb).localeCompare(ya+ma);
      }).forEach(m=>{ const o=document.createElement("option"); o.value=m; o.textContent=m; selM.appendChild(o); });
    }

    window.toggleAll=function(chk){ document.querySelectorAll(".filial-chk").forEach(c=>c.checked=chk.checked); renderTudo(); }

    window.renderTudo=function(){
      // Guarda o estado atual das colunas. Se o desenho falhar no meio, a gente
      // restaura isto e a tela não fica meio-apagada / zerada.
      const colA=document.getElementById("col-atrasados");
      const colH=document.getElementById("col-hoje");
      const colS=document.getElementById("col-semana");
      const backup={ a:colA?colA.innerHTML:"", h:colH?colH.innerHTML:"", s:colS?colS.innerHTML:"" };
      const backupPills={
        a:document.getElementById("pills-atrasados")?.innerHTML||"",
        h:document.getElementById("pills-hoje")?.innerHTML||"",
        s:document.getElementById("pills-semana")?.innerHTML||""
      };
      try{
      const grupos=getGruposSelecionados();
      const filiais=getFilialSelecionadas();
      const obs=getObsSelecionadas();
      const comprador=document.getElementById("f-comprador").value;
      const mes=document.getElementById("f-mes").value;
      const pedidoFiltro=document.getElementById("f-pedido").value.trim();
      const incluirServicos=document.getElementById("toggle-servicos").checked;
      atualizarBtnFilial();
      atualizarBtnGrupo();
      const today=getToday(), endWeek=getEndWeek();

      let pedidos=raw;
      if(!incluirServicos) pedidos=pedidos.filter(p=>!isServico(p.C7_GRPPROD));
      if(grupos.length) pedidos=pedidos.filter(p=>grupos.includes(p.C7_GRPPROD||""));
      if(filiais.length) pedidos=pedidos.filter(p=>filiais.includes(p.C7_FILIAL||""));
      if(comprador) pedidos=pedidos.filter(p=>(p.C7_COMPRADOR||"").trim()===comprador);
      if(mes){ pedidos=pedidos.filter(p=>{ const em=dtNum(p.C7_EMISSAO); return `${em.slice(4,6)}/${em.slice(0,4)}`===mes; }); }
      if(obs.length) pedidos=pedidos.filter(p=>obs.some(o=>o.trim()===(p.C7_OBS||"").trim()));
      if(pedidoFiltro) pedidos=pedidos.filter(p=>String(p.C7_NUM||"").trim()===pedidoFiltro.trim());

      const atrasados=pedidos.filter(p=>{const k=(p.C7_FILIAL||"").trim()+'_'+(p.C7_NUM||"").trim();const dt=datasAlteradas[k]||dtNum(p["DT ENTREGA"]);return dt&&dt<today;});
      const hoje=pedidos.filter(p=>{const k=(p.C7_FILIAL||"").trim()+'_'+(p.C7_NUM||"").trim();const dt=datasAlteradas[k]||dtNum(p["DT ENTREGA"]);return dt===today;});
      const semana=pedidos.filter(p=>{const k=(p.C7_FILIAL||"").trim()+'_'+(p.C7_NUM||"").trim();const dt=datasAlteradas[k]||dtNum(p["DT ENTREGA"]);return dt>today&&dt<=endWeek;});

      // Conta pedidos únicos e SKUs
      const pedUni=l=>new Set(l.map(p=>p.C7_NUM||"")).size;
      const skuUni=l=>new Set(l.map(p=>p.C7_PRODUTO||"").filter(Boolean)).size;

      document.getElementById("pills-atrasados").innerHTML=`<span class="col-pill">${pedUni(atrasados)} ped</span><span class="col-pill">${skuUni(atrasados)} sku</span>`;
      document.getElementById("pills-hoje").innerHTML=`<span class="col-pill">${pedUni(hoje)} ped</span><span class="col-pill">${skuUni(hoje)} sku</span>`;
      document.getElementById("pills-semana").innerHTML=`<span class="col-pill">${pedUni(semana)} ped</span><span class="col-pill">${skuUni(semana)} sku</span>`;

      renderCol("col-atrasados",ordenar(atrasados,sortState.atrasados),"card-red");
      renderCol("col-hoje",ordenar(hoje,sortState.hoje),"card-yellow");
      renderCol("col-semana",ordenar(semana,sortState.semana),"card-blue");
      }catch(e){
        // Algo quebrou no meio do desenho: restaura o que estava na tela.
        console.error("Erro ao renderizar — restaurando tela anterior:", e);
        if(colA) colA.innerHTML=backup.a;
        if(colH) colH.innerHTML=backup.h;
        if(colS) colS.innerHTML=backup.s;
        const pa=document.getElementById("pills-atrasados"); if(pa) pa.innerHTML=backupPills.a;
        const ph=document.getElementById("pills-hoje"); if(ph) ph.innerHTML=backupPills.h;
        const ps=document.getElementById("pills-semana"); if(ps) ps.innerHTML=backupPills.s;
        if(jaCarregouUmaVez) setStatus('congelado');
      }
    }

    function renderCol(id,lista,cls){
      const c=document.getElementById(id);
      c.innerHTML="";
      if(!lista.length){c.innerHTML='<div class="empty">Nenhum pedido</div>';return;}
      lista.forEach(p=>{
        const div=document.createElement("div");
        div.className=`card ${cls}`;
        const pedKey=(p.C7_FILIAL||"").trim()+'_'+(p.C7_NUM||"").trim();
        const novaData=datasAlteradas[pedKey];
        const dtExibir=novaData||dtNum(p["DT ENTREGA"]);
        const alterada=!!novaData;
        const grpNome=nomeGrupo(p.C7_GRPPROD);
        div.innerHTML=`
          <div class="card-line"></div>
          <div class="card-header">
            <span class="card-num">Ped. ${p.C7_NUM||"-"} · Fil. ${p.C7_FILIAL||"-"}</span>
            <span style="display:flex;gap:6px;align-items:center;">
              <span class="card-num">Emis. ${fmt(p.C7_EMISSAO)}</span>
              <span class="card-date">📅 ${fmt(dtExibir)}</span>
              ${alterada?`<span class="badge-alterada">✏️ DATA ALTERADA</span>`:''}
            </span>
          </div>
          <div class="card-desc">${p.C7_DESCRI||p.C7_PRODUTO||"-"}</div>
          ${p.C7_OBS?`<div class="card-obs">${p.C7_OBS}</div>`:''}
          <span class="card-status ${statusCls(p.STATUS_DESC)}">${p.STATUS_DESC||"-"}</span>
          <div class="card-footer">
            <div class="card-meta">Qtd <span>${p.C7_QUANT||0} ${p.C7_UM||""}</span></div>
            <div class="card-meta">Grupo <span>${grpNome}</span></div>
            <div class="card-meta">Comprador <span>${p.C7_COMPRADOR||"-"}</span></div>
            <div class="card-meta">Fornec. <span>${p.C7_FORNECE||"-"}</span></div>
            <div class="card-meta">Total <span>R$ ${Number(p.C7_TOTAL||0).toLocaleString("pt-BR",{minimumFractionDigits:2})}</span></div>
          </div>`;
        div.addEventListener("click",()=>window.abrirModal(p.C7_NUM,p.C7_FILIAL||"",dtExibir));
        c.appendChild(div);
      });
    }

    window.exportarExcel=function(){
      const grupos=getGruposSelecionados();
      const filiais=getFilialSelecionadas();
      const obs=getObsSelecionadas();
      const comprador=document.getElementById("f-comprador").value;
      const mes=document.getElementById("f-mes").value;
      const incluirServicos=document.getElementById("toggle-servicos").checked;
      let pedidos=[...raw];
      if(!incluirServicos) pedidos=pedidos.filter(p=>!isServico(p.C7_GRPPROD));
      if(grupos.length) pedidos=pedidos.filter(p=>grupos.includes(p.C7_GRPPROD||""));
      if(filiais.length) pedidos=pedidos.filter(p=>filiais.includes(p.C7_FILIAL||""));
      if(comprador) pedidos=pedidos.filter(p=>(p.C7_COMPRADOR||"").trim()===comprador);
      if(mes){ pedidos=pedidos.filter(p=>{ const em=dtNum(p.C7_EMISSAO); return `${em.slice(4,6)}/${em.slice(0,4)}`===mes; }); }
      if(obs.length) pedidos=pedidos.filter(p=>obs.some(o=>o.trim()===(p.C7_OBS||"").trim()));
      const today=getToday(),endWeek=getEndWeek();
      const linhas=pedidos.map(p=>{
        const novaData=datasAlteradas[(p.C7_FILIAL||"").trim()+'_'+(p.C7_NUM||"").trim()]||"";
        const dtOriginal=dtNum(p["DT ENTREGA"]);
        const dtEfetiva=novaData||dtOriginal;
        let situacao=!dtEfetiva?"Sem data":dtEfetiva<today?"Atrasado":dtEfetiva===today?"Entrega Hoje":dtEfetiva<=endWeek?"Essa Semana":"Futuro";
        return [p.C7_NUM||"",p.C7_FILIAL||"",fmt(p.C7_EMISSAO),dtOriginal?fmt(dtOriginal):"",novaData?fmt(novaData):"",novaData?"SIM":"NÃO",situacao,p.C7_DESCRI||"",p.C7_OBS||"",p.STATUS_DESC||"",p.C7_QUANT||0,p.C7_UM||"",p.C7_GRPPROD||"",nomeGrupo(p.C7_GRPPROD),p.C7_COMPRADOR||"",p.C7_FORNECE||"",Number(p.C7_TOTAL||0)];
      });
      const header=["Nº Pedido","Filial","Emissão","Data Original","Nova Data","Data Alterada?","Situação","Descrição","Observação","Status","Qtd","UM","Cód Grupo","Grupo Geral","Comprador","Fornecedor","Valor Total"];
      const csv="\uFEFF"+[header,...linhas].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
      a.download=`pedidos_${new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")}.csv`;
      a.click();
    }

    window.carregarDados=carregarDados;

    // iniciarApp() arranca a aplicação (carga + timer diário). Só é chamado
    // quando há login válido — seja por sessão salva, seja após digitar a senha.
    let appIniciado=false;
    function iniciarApp(){
      if(appIniciado) return;   // evita iniciar duas vezes
      appIniciado=true;
      carregarDados();
      // Atualização DIÁRIA: a cada 5 minutos verificamos se o dia virou.
      // A trava interna (jaAtualizouHoje) garante que o Firestore só é lido
      // UMA vez por dia — mesmo que esta checagem rode várias vezes.
      setInterval(()=>{
        if(!jaAtualizouHoje()) carregarDados();
      }, 5*60*1000);
    }
    window.iniciarApp=iniciarApp;

    // Se já havia sessão válida (decidido lá no topo), arranca agora —
    // depois que todas as funções já foram definidas.
    if(sessaoValida()) iniciarApp();
  </script>
